<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Feedback Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>💼 Client Feedback Dashboard</h1>
    <p class="subtitle">Collect and manage customer feedback efficiently</p>
  </header>

  <section class="feedback-form">
    <h2>Submit Feedback</h2>
    <form id="feedbackForm">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <textarea id="message" placeholder="Your feedback" required></textarea>
      <select id="rating" required>
        <option value="">Select Rating</option>
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
      </select>
      <button type="submit">Submit Feedback</button>
    </form>
    <p id="formMsg"></p>
  </section>

  <section class="feedback-list">
    <h2>All Feedback</h2>
    <input type="text" id="search" placeholder="Search feedback..." />
    <ul id="feedbacks"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
