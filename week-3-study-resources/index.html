<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Resources Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Study Resources</h1>
    <p>Find books to support focused learning</p>
  </header>

  <main>
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="What do you want to learn today?" />
      <button id="searchBtn">Search</button>
    </div>

    <p id="statusText" class="status"></p>

    <section id="results" class="results"></section>
  </main>

  <footer>
    <p>Powered by Open Library API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
